name: RDCMobile
options:
  bundleIdPrefix: org.tocministries.rdc
  deploymentTarget:
    iOS: "17.0"
targets:
  RDCMobile:
    type: application
    platform: iOS
    sources: [RDCMobile]
    info:
      path: generated/Info.plist
      properties:
        CFBundleDisplayName: RDC Mobile
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connect to your owner-authorized RDC gateway on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tocministries.rdc.mobile
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
