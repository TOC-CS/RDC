<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>RDC live preview</title>
  <style>:root { color-scheme: light dark; font: 13px/1.4 system-ui, sans-serif; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; width: 100%; height: auto; overflow: hidden; }
#canvas { color: CanvasText; background: Canvas; }
#panel { display: flex; flex-direction: column; min-width: 0; overflow: hidden; height: auto; }
header, #closed-card { display: flex; gap: 8px; align-items: center; padding: 5px 8px; min-height: 38px; }
header { border-bottom: 1px solid color-mix(in srgb, CanvasText 14%, Canvas); }
header { flex: none; }
header strong { white-space: nowrap; }
#closed-card { flex-wrap: wrap; }
.brand { display: block; flex: none; border-radius: 4px; }
.status { opacity: .72; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.controls { margin-inline-start: auto; display: flex; gap: 2px; }
button {
  padding: 4px 7px; min-height: 28px; color: inherit; font: inherit; cursor: pointer;
  background: transparent; border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); border-radius: 6px;
}
.controls button { min-width: 27px; padding: 2px 4px; border-color: transparent; font-size: 17px; }
button:not(:disabled):hover { background: color-mix(in srgb, CanvasText 9%, Canvas); }
button:focus-visible { outline: 2px solid Highlight; outline-offset: -2px; }
button:disabled { opacity: .5; cursor: default; }
#screen {
  position: relative; display: grid; place-items: center; overflow: hidden;
  flex: 0 1 auto; width: 100%; aspect-ratio: 16 / 9; min-height: 0;
  background: color-mix(in srgb, CanvasText 5%, Canvas);
}
#frame { width: 100%; height: 100%; position: absolute; inset: 0; object-fit: contain; object-position: top center; }
#screen.window-sized { display: block; overflow: auto; }
#screen.window-sized #frame { position: relative; display: block; object-fit: fill; }
.size-note { position: static !important; width: auto !important; height: auto !important; clip-path: none !important; flex: none; font-size: 11px; padding: 3px 8px; }
#cursor { position: absolute; pointer-events: none; }
#cursor svg { display: block; }
#empty { text-align: center; padding: 10px; max-width: 25rem; }
#empty h1 { font-size: 1rem; margin: 0 0 4px; }
#empty p { margin: 0 0 6px; }
.presentation-note { flex: none; margin: 0; padding: 4px 8px; font-size: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
@media (max-width: 280px) {
  header, #closed-card { gap: 4px; padding-inline: 4px; }
  header .brand { display: none; }
}

#canvas:is([data-mode="fullscreen"], [data-mode="pip"]) #panel { max-height: 100dvh; }
</style>
</head>
<body>
  <main id="canvas" data-mode="inline" aria-label="RDC live preview">
    <section id="closed-card" hidden aria-label="Hidden RDC preview">
      <span id="closed-note">Preview hidden. Work keeps running.</span>
      <button id="reopen">Reopen preview</button>
      <button id="dismiss">Dismiss view</button>
    </section>
    <section id="panel" aria-label="Live RDC work preview">
      <header>
        <img class="brand" data-rdc-logo alt="" width="20" height="20">
        <strong>RDC Preview</strong>
        <span id="connection" class="status" role="status"><span id="connection-text">Connecting</span></span>
        <button id="connection-retry" hidden>Retry connection</button>
        <button id="resize-retry" aria-label="Retry window resizing" title="Retry window resizing after enabling Accessibility" hidden>↔</button>
        <div class="controls" aria-label="Preview window controls">
          <button id="inline" aria-label="Inline" title="Return inline" hidden>↙</button>
          <button id="expand" aria-label="Expand" title="Expand preview" hidden>⛶</button>
          <button id="float" aria-label="Float" title="Request floating view" hidden>↗</button>
          <button id="hide" aria-label="Hide preview" title="Hide preview">×</button>
        </div>
      </header>
      <div id="screen" aria-label="Live work image, view only">
        <img id="frame" alt="Live RDC workspace" hidden draggable="false">
        <span id="cursor" role="img" aria-label="Agent cursor" hidden><svg aria-hidden="true" viewBox="0 0 24 30" width="23" height="29"><path d="M3 2L20 17L12 18L8 26Z" fill="#5ce5c0" stroke="#0b2b29" stroke-width="2" stroke-linejoin="round"/></svg></span>
        <div id="empty">
          <h1 id="empty-title">Connecting to your work</h1>
          <p id="empty-copy">The live view will appear here.</p>
          <button id="preview-retry" hidden disabled>Retry preview</button>
        </div>
      </div>
      <p id="float-note" class="presentation-note" role="status" hidden></p>
      <span id="mode-note" class="sr-only" role="status"></span>
    </section>
  </main>
