<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>RDC live preview</title>
  <style>/* RDC_STYLES */</style>
</head>
<body>
  <main id="canvas" data-mode="inline" aria-label="RDC live preview">
    <section id="closed-card" hidden aria-label="Hidden RDC preview">
      <span id="closed-note">Preview hidden. Work keeps running.</span>
      <button id="reopen">Reopen preview</button>
      <button id="dismiss">Dismiss view</button>
    </section>
    <section id="panel" aria-label="Live RDC work preview">
      <header>
        <img class="brand" data-rdc-logo alt="" width="20" height="20">
        <strong>RDC Preview</strong>
        <span id="connection" class="status" role="status"><span id="connection-text">Connecting</span></span>
        <button id="connection-retry" hidden>Retry connection</button>
        <button id="resize-retry" aria-label="Retry window resizing" title="Retry window resizing after enabling Accessibility" hidden>↔</button>
        <div class="controls" aria-label="Preview window controls">
          <button id="inline" aria-label="Inline" title="Return inline" hidden>↙</button>
          <button id="expand" aria-label="Expand" title="Expand preview" hidden>⛶</button>
          <button id="float" aria-label="Float" title="Request floating view" hidden>↗</button>
          <button id="hide" aria-label="Hide preview" title="Hide preview">×</button>
        </div>
      </header>
      <div id="screen" aria-label="Live work image, view only">
        <img id="frame" alt="Live RDC workspace" hidden draggable="false">
        <span id="cursor" role="img" aria-label="Agent cursor" hidden><svg aria-hidden="true" viewBox="0 0 24 30" width="23" height="29"><path d="M3 2L20 17L12 18L8 26Z" fill="#5ce5c0" stroke="#0b2b29" stroke-width="2" stroke-linejoin="round"/></svg></span>
        <div id="empty">
          <h1 id="empty-title">Connecting to your work</h1>
          <p id="empty-copy">The live view will appear here.</p>
          <button id="preview-retry" hidden disabled>Retry preview</button>
        </div>
      </div>
      <p id="float-note" class="presentation-note" role="status" hidden></p>
      <span id="mode-note" class="sr-only" role="status"></span>
    </section>
  </main>
  <script>/* RDC_SCRIPT */</script>
</body>
</html>
